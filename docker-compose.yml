name: flowerp

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: flowerp-app:local
    container_name: flowerp-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - PHP_IDE_CONFIG=serverName=flowerp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flowerp

  nginx:
    image: nginx:alpine
    container_name: flowerp-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - flowerp

  postgres:
    image: postgres:16-alpine
    container_name: flowerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-flowerp}
      POSTGRES_USER: ${DB_USERNAME:-flowerp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - flowerp-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-flowerp} -d ${DB_DATABASE:-flowerp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flowerp

  redis:
    image: redis:7-alpine
    container_name: flowerp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flowerp

  mailpit:
    image: axllent/mailpit:latest
    container_name: flowerp-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - flowerp

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: flowerp-app:local
    container_name: flowerp-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1"]
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flowerp

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: flowerp-app:local
    container_name: flowerp-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flowerp

networks:
  flowerp:
    driver: bridge

volumes:
  flowerp-pgdata:
    driver: local
